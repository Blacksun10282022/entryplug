# plug.yaml — the only place in a content repo where paths may appear. Every path is relative to this file.
# This one is the Sunzi example equipment (CC0). A real content repo writes its own; the machine never knows
# where a content repo is, it only knows root.
machine: entryplug 0.1.0        # pins the machine version; the plug check header verifies it
shape_version: 1                # a shape version the machine does not know is an ERROR: it refuses to run

self: self                      # the Base: RULES.md · facts/ · style.md · records/
proposals: proposals            # refit requests: pending/ · rejected/ · applied/ · tools/
index: .kb/index.sqlite         # gitignored, rebuilt at will
index_md: index.md              # the human-readable index, one line per page
numbers: self/数字.md           # the sync rate (numbers page), written by plug check
hooks: .kb/hooks                # "last fired" stamps for the hooks
pin: .kb/pin.md                 # the compaction pin
language: 中文                  # the "answer in" line of the pin

tools:
  - name: sunzi
    path: tools/sunzi
    depends: []                 # equipment names this one may link to with [[other-tool/entry]]
    ttl_days: {default: 90, price: 30, profile: 90}   # material shelf life, by kind
    unreviewed: 2               # migration reconciliation: how many [?] lines the dictionary should have

pilots:                         # plug index mirrors every SKILL.md into these directories
  claude-code: {skills: .claude/skills, user_skills: "~/.claude/skills"}
  codex: {skills: .agents/skills, user_skills: "~/.agents/skills"}

outbound:                       # sortie lock: a hit is PreToolUse exit 2 (tool = regex on the tool name; match = regex on the tool input JSON)
  - tool: "^Bash$"
    match: "(?i)\\b(curl|wget|ssh|scp|sendmail|git push)\\b"
  - tool: "(?i)^mcp__.*(send|post|submit|pay|email|message|publish)"

protected:                      # berserk lock: committing these needs KB_APPROVE=1, which only plug apply sets.
  - self/RULES.md               # Anything under tools/ that is not registered above is NOT protected.
  - self/facts/**
  - tools/**
unprotected:                    # the corpus is appended to freely; work/ and workshop/ are the free zones
  - "**/corpus/**"
  - "work/**"
  - "workshop/**"
