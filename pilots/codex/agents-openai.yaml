# Goes at <content-repo>/.agents/skills/<equipment>/agents/openai.yaml. `plug index` writes one while mirroring
# the manuals, and rewrites it only when the switch disagrees with the manual's frontmatter.
# Codex's implicit-invocation switch does not live in SKILL.md frontmatter, it lives here. Sensitive equipment
# marked `disable-model-invocation: true` in the manual gets allow_implicit_invocation: false instead.
policy:
  allow_implicit_invocation: true
