name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/plug.exe
            asset: plug-windows-x86_64.exe
          - os: ubuntu-latest
            bin: target/release/plug
            asset: plug-linux-x86_64
          - os: macos-latest
            bin: target/release/plug
            asset: plug-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Upload Release Binary
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
