[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entryplug"
version = "0.1.0"
description = "Entryplug (插入栓): the plug between one person's written judgment and the agent that uses it — three file shapes, one read-only search, two machine-enforced locks, one check."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["jieba>=0.42", "PyYAML>=6.0"]

[project.optional-dependencies]
dense = []          # stub interface only (search.dense_candidates); no implementation in this version
dev = ["pytest>=8"]

[project.scripts]
plug = "entryplug.cli:main"

[tool.setuptools]
packages = ["entryplug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
