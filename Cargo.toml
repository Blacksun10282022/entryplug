[package]
name = "entryplug"
version = "0.2.0"
edition = "2021"
description = "Entry Plug (plug): single-binary local cognitive kernel — Markdown+Git truth, SQLite WAL projection, read-only MCP, cross-pilot gates & trace."
license = "MIT"

[[bin]]
name = "plug"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl", "unicode-bool"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
